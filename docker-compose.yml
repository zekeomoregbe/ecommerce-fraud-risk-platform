services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraudrisk
      POSTGRES_USER: frauduser
      POSTGRES_PASSWORD: fraudpass
    ports:
      - "5432:5432"
    volumes:
      - fraudrisk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frauduser -d fraudrisk"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fraudrisk
      DB_USERNAME: frauduser
      DB_PASSWORD: fraudpass
      PYTHON_EXECUTABLE: python3
      RISK_ENGINE_SCRIPT: scripts/risk_engine.py
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  fraudrisk_pgdata:
